<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>랜덤7942 · 관리자</title>
  <style>
    :root { --bg:#14161a; --card:#1e2127; --fg:#eceef1; --sub:#9aa1ab; --line:#2c3036;
            --primary:#3b66cf; --danger:#d94848; --ok:#2e9e5b; --warn:#d98a2b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    h1 { font-size:19px; margin:0; }
    button { font:inherit; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .primary { background:var(--primary); color:#fff; }
    .danger { background:var(--danger); color:#fff; }
    .ghost { background:var(--line); color:var(--fg); }
    input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:var(--bg); color:var(--fg); width:100%; }

    #login { max-width:360px; margin:12vh auto; padding:24px; background:var(--card);
             border:1px solid var(--line); border-radius:14px; }
    #login h1 { margin-bottom:16px; text-align:center; }
    #login input { margin-bottom:10px; }
    #login .msg { color:var(--danger); font-size:13px; min-height:18px; }

    #main { display:none; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px;
             padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card);
             position:sticky; top:0; z-index:5; }
    .wrap { padding:16px; max-width:900px; margin:0 auto; }

    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    @media (max-width:640px){ .cards{ grid-template-columns:repeat(2,1fr); } }
    .scard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .scard .n { font-size:26px; font-weight:800; }
    .scard .t { color:var(--sub); font-size:13px; margin-top:2px; }

    .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .tab { background:var(--line); color:var(--sub); }
    .tab.active { background:var(--primary); color:#fff; }
    .panel { display:none; } .panel.active { display:block; }

    .item { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:14px; margin-bottom:12px; }
    .item .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .tag { display:inline-block; background:var(--danger); color:#fff; font-size:12px;
           padding:3px 8px; border-radius:20px; margin:2px 4px 2px 0; }
    .tag.cnt { background:var(--warn); }
    .muted { color:var(--sub); font-size:13px; }
    .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--sub); }
    .acts { display:flex; gap:6px; }
    .log { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
    .log.open { display:block; }
    .msgs { display:flex; flex-direction:column; }
    .bubble { max-width:80%; padding:7px 11px; border-radius:12px; margin:4px 0; font-size:14px; word-break:break-word; }
    .bubble.rep { background:var(--line); align-self:flex-start; }
    .bubble.oth { background:#333a46; align-self:flex-start; }
    .bubble img { max-width:180px; border-radius:8px; display:block; }
    .sub-report { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
    .empty { color:var(--sub); text-align:center; padding:48px 0; }
  </style>
</head>
<body>
  <div id="login">
    <h1>관리자 로그인</h1>
    <input id="email" type="email" placeholder="관리자 이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="login-msg"></div>
    <button class="primary" id="btn-login" style="width:100%">로그인</button>
  </div>

  <div id="main">
    <header>
      <h1>랜덤7942 · 관리자</h1>
      <button class="ghost" id="btn-logout">로그아웃</button>
    </header>
    <div class="wrap">
      <div class="cards">
        <div class="scard"><div class="n" id="c-reports">–</div><div class="t">총 신고</div></div>
        <div class="scard"><div class="n" id="c-users">–</div><div class="t">신고된 이용자</div></div>
        <div class="scard"><div class="n" id="c-banned">–</div><div class="t">차단된 이용자</div></div>
        <div class="scard"><div class="n" id="c-wait">–</div><div class="t">현재 대기</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="users">🚨 신고된 이용자</button>
        <button class="tab" data-tab="recent">🕑 최근 신고</button>
        <button class="tab" data-tab="banned">🚫 차단 목록</button>
      </div>
      <div class="panel active" id="panel-users"></div>
      <div class="panel" id="panel-recent"></div>
      <div class="panel" id="panel-banned"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js?v=12"></script>
  <script src="admin.js?v=12"></script>
</body>
</html>
