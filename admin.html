<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>랜덤7942 · 관리자</title>
  <style>
    :root { --bg:#14161a; --card:#1e2127; --fg:#eceef1; --sub:#9aa1ab; --line:#2c3036;
            --primary:#3b66cf; --danger:#d94848; --ok:#2e9e5b; --warn:#d98a2b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    h1 { font-size:19px; margin:0; }
    button { font:inherit; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .primary { background:var(--primary); color:#fff; }
    .danger { background:var(--danger); color:#fff; }
    .ghost { background:var(--line); color:var(--fg); }
    input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:var(--bg); color:var(--fg); width:100%; }

    #login { max-width:360px; margin:12vh auto; padding:24px; background:var(--card);
             border:1px solid var(--line); border-radius:14px; }
    #login h1 { margin-bottom:16px; text-align:center; }
    #login input { margin-bottom:10px; }
    #login .msg { color:var(--danger); font-size:13px; min-height:18px; }

    #main { display:none; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px;
             padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card);
             position:sticky; top:0; z-index:5; }
    header .brand { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800; }
    header .brand img { width:30px; height:30px; border-radius:8px; }
    header .brand b { color:var(--primary); font-weight:800; }
    .wrap { padding:16px; max-width:900px; margin:0 auto; }

    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    @media (max-width:640px){ .cards{ grid-template-columns:repeat(2,1fr); } }
    .scard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 14px;
             transition:transform .08s; }
    .scard:hover { transform:translateY(-2px); }
    .scard .n { font-size:28px; font-weight:800; letter-spacing:-.5px; }
    .scard .t { color:var(--sub); font-size:12.5px; margin-top:4px; }
    .scard.live .n { color:var(--ok); }
    .scard.alert { border-color:#5a3a1a; background:linear-gradient(180deg, rgba(217,138,43,.08), transparent); }
    .cards { grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); }
    .section-title { font-size:12px; color:var(--sub); margin:6px 0 10px; font-weight:800;
                     letter-spacing:.3px; text-transform:uppercase; }
    .notice-box { background:var(--card); border:1px solid var(--line); border-radius:12px;
                  padding:14px; margin-bottom:16px; }
    .notice-box textarea { width:100%; font:inherit; border-radius:8px; border:1px solid var(--line);
                           background:var(--bg); color:var(--fg); padding:10px; resize:vertical; }
    .statrow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .statrow .bar { height:14px; background:var(--primary); border-radius:7px; min-width:3px; }
    .statrow .lbl { width:120px; font-size:14px; }
    .statrow .val { color:var(--sub); font-size:13px; }

    .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .tab { background:var(--line); color:var(--sub); }
    .tab.active { background:var(--primary); color:#fff; }
    .panel { display:none; } .panel.active { display:block; }

    .item { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:14px; margin-bottom:12px; }
    .item .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .tag { display:inline-block; background:var(--danger); color:#fff; font-size:12px;
           padding:3px 8px; border-radius:20px; margin:2px 4px 2px 0; }
    .tag.cnt { background:var(--warn); }
    .tag.ok { background:var(--ok); }
    .scard.alert .n { color:var(--warn); }
    .item.resolved { opacity:.55; }
    .muted { color:var(--sub); font-size:13px; }
    .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--sub); }
    .acts { display:flex; gap:6px; }
    .log { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
    .log.open { display:block; }
    .msgs { display:flex; flex-direction:column; }
    .bubble { max-width:80%; padding:7px 11px; border-radius:12px; margin:4px 0; font-size:14px; word-break:break-word; }
    .bubble.rep { background:var(--line); align-self:flex-start; }
    .bubble.oth { background:#333a46; align-self:flex-start; }
    .bubble img { max-width:180px; border-radius:8px; display:block; }
    .sub-report { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
    .empty { color:var(--sub); text-align:center; padding:48px 0; }
    .selbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;
              background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
              position:sticky; top:58px; z-index:4; }
    .selbar .muted { flex:1; }
    .selbar select { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--line);
                     background:var(--bg); color:var(--fg); }
    .selbar button:disabled { opacity:.4; cursor:default; }
    .chk { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .chk input { width:18px; height:18px; margin:0; flex:none; accent-color:var(--primary); }
    .item.selected { border-color:var(--primary); }
  </style>
</head>
<body>
  <div id="login">
    <h1>관리자 로그인</h1>
    <input id="email" type="email" placeholder="관리자 이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="login-msg"></div>
    <button class="primary" id="btn-login" style="width:100%">로그인</button>
  </div>

  <div id="main">
    <header>
      <div class="brand"><img src="icon-192.png?v=bs" alt=""><span>랜덤7942 <b>관리자</b></span></div>
      <div class="acts" style="align-items:center">
        <span class="mono" id="whoami"></span>
        <button class="primary" id="btn-refresh">↻ 새로고침</button>
        <button class="ghost" id="btn-logout">로그아웃</button>
      </div>
    </header>
    <div class="wrap">
      <div class="section-title">실시간 현황</div>
      <div class="cards">
        <div class="scard live"><div class="n" id="c-online">–</div><div class="t">총 접속자</div></div>
        <div class="scard live"><div class="n" id="c-rooms">–</div><div class="t">진행 중 대화</div></div>
        <div class="scard live"><div class="n" id="c-chatting">–</div><div class="t">대화 중</div></div>
        <div class="scard live"><div class="n" id="c-waiting">–</div><div class="t">대기 중</div></div>
        <div class="scard live"><div class="n" id="c-idle">–</div><div class="t">대기/둘러보는 중</div></div>
      </div>
      <div class="section-title">신고·차단</div>
      <div class="cards">
        <div class="scard alert"><div class="n" id="c-unresolved">–</div><div class="t">미처리 신고</div></div>
        <div class="scard"><div class="n" id="c-today">–</div><div class="t">오늘 신고</div></div>
        <div class="scard"><div class="n" id="c-users">–</div><div class="t">신고된 이용자</div></div>
        <div class="scard"><div class="n" id="c-banned">–</div><div class="t">차단된 이용자</div></div>
      </div>

      <!-- 전체 공지 -->
      <div class="notice-box">
        <div class="section-title" style="margin-top:0">전체 공지 (모든 이용자 화면 상단에 표시)</div>
        <textarea id="notice-text" rows="2" placeholder="공지 내용을 입력하세요 (비우고 삭제하면 배너가 사라집니다)"></textarea>
        <div class="acts" style="margin-top:8px">
          <button class="primary" id="btn-notice-save">공지 게시</button>
          <button class="ghost" id="btn-notice-clear">공지 삭제</button>
          <span class="muted" id="notice-status"></span>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="logs">💬 대화 로그</button>
        <button class="tab" data-tab="users">🚨 신고된 이용자</button>
        <button class="tab" data-tab="recent">🕑 최근 신고</button>
        <button class="tab" data-tab="stats">📊 사유 통계</button>
        <button class="tab" data-tab="banned">🚫 차단 목록</button>
      </div>
      <div class="panel active" id="panel-logs"></div>
      <div class="panel" id="panel-users"></div>
      <div class="panel" id="panel-recent"></div>
      <div class="panel" id="panel-stats"></div>
      <div class="panel" id="panel-banned"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js?v=47"></script>
  <script src="admin.js?v=47"></script>
</body>
</html>
