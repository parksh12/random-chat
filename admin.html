<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>랜덤7942 · 신고 관리</title>
  <style>
    :root { --bg:#14161a; --card:#1e2127; --fg:#eceef1; --sub:#9aa1ab; --line:#2c3036;
            --primary:#3b66cf; --danger:#d94848; --ok:#2e9e5b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    h1 { font-size:20px; margin:0; }
    button { font:inherit; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .primary { background:var(--primary); color:#fff; }
    .ghost { background:var(--line); color:var(--fg); }
    input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
            background:var(--bg); color:var(--fg); width:100%; }

    #login { max-width:360px; margin:12vh auto; padding:24px; background:var(--card);
             border:1px solid var(--line); border-radius:14px; }
    #login h1 { margin-bottom:16px; text-align:center; }
    #login input { margin-bottom:10px; }
    #login .msg { color:var(--danger); font-size:13px; min-height:18px; }

    #main { display:none; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px;
             padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card);
             position:sticky; top:0; z-index:5; }
    .wrap { padding:16px; max-width:820px; margin:0 auto; }

    .item { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:14px; margin-bottom:12px; }
    .item .row { display:flex; justify-content:space-between; align-items:center; gap:10px;
                 flex-wrap:wrap; }
    .tag { display:inline-block; background:var(--danger); color:#fff; font-size:12px;
           padding:3px 8px; border-radius:20px; }
    .muted { color:var(--sub); font-size:13px; }
    .acts { display:flex; gap:6px; }
    .log { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
    .log.open { display:block; }
    .msgs { display:flex; flex-direction:column; }
    .bubble { max-width:80%; padding:7px 11px; border-radius:12px; margin:4px 0; font-size:14px;
              word-break:break-word; }
    .bubble.rep { background:var(--line); align-self:flex-start; }
    .bubble.oth { background:#333a46; align-self:flex-start; }
    .bubble img { max-width:180px; border-radius:8px; display:block; }
    .empty { color:var(--sub); text-align:center; padding:48px 0; }

    #resp { position:fixed; inset:auto 0 0 0; max-width:480px; margin:0 auto;
            background:var(--card); border:1px solid var(--line); border-radius:14px 14px 0 0;
            display:none; flex-direction:column; height:68vh; z-index:20;
            box-shadow:0 -6px 24px rgba(0,0,0,.4); }
    #resp.open { display:flex; }
    #resp .rhead { display:flex; justify-content:space-between; align-items:center;
                   padding:12px 14px; border-bottom:1px solid var(--line); }
    #resp .rbody { flex:1; overflow-y:auto; padding:12px; }
    #resp .rfoot { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
    .me { background:var(--primary); color:#fff; margin-left:auto; }
  </style>
</head>
<body>
  <div id="login">
    <h1>신고 관리 로그인</h1>
    <input id="email" type="email" placeholder="관리자 이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="login-msg"></div>
    <button class="primary" id="btn-login" style="width:100%">로그인</button>
  </div>

  <div id="main">
    <header>
      <h1>🚨 신고 관리</h1>
      <button class="ghost" id="btn-logout">로그아웃</button>
    </header>
    <div class="wrap"><div id="reports"></div></div>
  </div>

  <!-- 신고된 이용자에게 안내·경고 -->
  <div id="resp">
    <div class="rhead">
      <b id="resp-peer">신고된 이용자</b>
      <button class="ghost" id="resp-close">닫기</button>
    </div>
    <div class="rbody"><div class="msgs" id="resp-msgs"></div></div>
    <div class="rfoot">
      <input id="resp-input" placeholder="안내·경고 메시지…">
      <button class="primary" id="resp-send">전송</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js?v=11"></script>
  <script src="admin.js?v=11"></script>
</body>
</html>
