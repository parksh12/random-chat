<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>랜덤채팅</title>
  <style>
    :root { --bg: #f5f6f8; --fg: #222; --sub: #777; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --fg: #eee; --sub: #999; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: var(--sub); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>랜덤채팅</h1>
    <p>준비 중입니다.</p>
  </main>
</body>
</html>
